version: '3.8'

services:
  # ==================== Vector Database - Qdrant ====================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_unified
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
      # Optional: custom config (only mount if directory exists and has files)
      # - ./rag/qdrant_config:/qdrant/config
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__HOST=0.0.0.0
      - QDRANT__LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - unified_network

  # ==================== Ollama - LLM & Embeddings ====================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama_unified
  #   ports:
  #     - "11434:11434"  # Ollama API
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   networks:
  #     - unified_network

  # ==================== Redis - Caching ====================
  redis:
    image: redis:7-alpine
    container_name: redis_unified
    ports:
      - "6380:6379"  # Changed external port to avoid conflict
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - unified_network

  # ==================== MySQL Database ====================
  mysql:
    image: mysql:8.0
    container_name: mysql_unified
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-import SQL (use root myhotel.sql if rag/myhotel.sql doesn't exist)
      - ./myhotel.sql:/docker-entrypoint-initdb.d/myhotel.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=myhotel
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - unified_network

  # ==================== phpMyAdmin - Database Management ====================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_unified
    ports:
      - "8181:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - unified_network

  # ==================== Unified API Service (RAG + Recommendation) ====================
  unified_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unified_api
    ports:
      - "5000:5000"
    volumes:
      # Mount data directories for indexing (optional)
      - ./datasets_extracted:/app/datasets_extracted:ro
      - ./processed:/app/processed:ro
      # Mount cache directory for persistence
      - embedding_cache:/app/.embedding_cache
      - ./rag/qdrant_config:/qdrant/config
      - ./src:/app/src:rw
      - ./recommendation:/app/recommendation:rw
      - ./scripts:/app/scripts:rw
      - ./setup_collections.py:/app/setup_collections.py:rw
      - ./index_with_hybrid.py:/app/index_with_hybrid.py:rw
      - ./app.py:/app/app.py:rw
      - ./core:/app/core:rw
      - ./shared:/app/shared:rw
      - ./config.py:/app/config.py:rw
      - ./logger.py:/app/logger.py:rw
      - ./utils.py:/app/utils.py:rw
      - ./logs:/app/logs
    environment:
      # Service Configuration
      - PORT=5000
      - HOST=0.0.0.0
      - DEBUG=False
      - SECRET_KEY=unified-service-secret-key-change-in-production
      
      # Qdrant Vector Database
      - QDRANT_URL=http://qdrant:6333
      
      # Collections Configuration
      - RAG_COLLECTION_HOTELS=hotels_rag
      - RAG_COLLECTION_COUPONS=coupons_rag
      - REC_COLLECTION_HOTELS=hotels_recommendation
      - COLLECTION_NAME=hotels
      
      # Ollama Configuration (for embeddings only)
      # Windows/Mac: use host.docker.internal
      # Linux: may need to use 172.17.0.1 or add extra_hosts
      - OLLAMA_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=bge-m3
      
      # LLM Configuration (using LM Studio for qwen3)
      - LLM_MODEL=qwen3
      - LLM_PROVIDER=lm_studio
      - LM_STUDIO_URL=http://host.docker.internal:1234
      
      # Redis Cache
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
      
      # MySQL Database
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - MYSQL_DATABASE=myhotel
      
      # RAG Configuration
      - AUTO_INDEX_COUPONS=false
      - RAG_TOP_K=5
      - RAG_CHUNK_SIZE=1000
      - RAG_CHUNK_OVERLAP=200
      
      # Recommendation Configuration
      - REC_TOP_K=10
      - REC_USE_OLLAMA=true
      
      # Performance Configuration
      - EMBEDDING_CACHE_ENABLED=true
      - MAX_WORKERS=4
      
      # Auto-index data on first run (set to true to auto-index)
      - AUTO_INDEX_DATA=false
    depends_on:
      qdrant:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - unified_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  qdrant_storage:
    driver: local
    name: qdrant_unified_storage
  ollama_data:
    driver: local
    name: ollama_unified_data
  redis_data:
    driver: local
    name: redis_unified_data
  mysql_data:
    driver: local
    name: mysql_unified_data
  embedding_cache:
    driver: local
    name: unified_api_embedding_cache

networks:
  unified_network:
    driver: bridge
    name: unified_network

